version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - IMAGE_MAX_SIZE_MB=10
      - IMAGE_RETENTION_HOURS=24
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}

  analysis_service:
    build:
      context: .
      dockerfile: Dockerfile.analysis
    environment:
      - PYTHONUNBUFFERED=1
